# GitHub Pages via Actions — em Settings → Pages, Source precisa ser "GitHub Actions".
# Secret: VITE_ANTHROPIC_API_KEY
#
# Se o job "deploy" falhar com 404 ao criar deployment:
# - Repositório PRIVADO no plano Free não tem Pages (deixe público ou use GitHub Pro/Team).
# - Confira Settings → Pages → Source = GitHub Actions e salve; rode o workflow de novo.

name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install e build
        env:
          VITE_ANTHROPIC_API_KEY: ${{ secrets.VITE_ANTHROPIC_API_KEY }}
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm ci && npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
